version: '3.8'
services:
  db:
    image: postgres:13
    container_name: postgres-db
    environment:
      POSTGRES_DB: evershop
      POSTGRES_USER: evershopuser
      POSTGRES_PASSWORD: evershoppass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  evershop:
    build: .
    container_name: evershop-app
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://evershopuser:evershoppass@db:5432/evershop

volumes:
  pgdata:

